<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoTrade - Cadastro</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Font Awesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>
    <header class="text-center py-4">
        <img src="assets/images/Logo Ecotrade.png" alt="EcoTrade Logo" class="mb-3" style="max-width: 150px;" />
    </header>

    <main>
        <section class="container">
            <div class="login-container text-center">
                <h1 class="h3 mb-3 fw-normal">Cadastre-se</h1>


                <form id="formCadastro">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="floatingName" placeholder="Nome Completo"
                            required />
                        <div class="invalid-feedback" id="nameFeedback"></div>
                        <label for="floatingName">Nome Completo</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="floatingInput" placeholder="nome@exemplo.com"
                            required />
                        <div class="invalid-feedback" id="emailFeedback"></div>
                        <label for="floatingInput">Email</label>
                    </div>


                    <div class="form-floating mb-3">
                        <input type="password" class="form-control" id="floatingPassword" placeholder="Senha"
                            required />
                        <div class="invalid-feedback" id="passwordFeedback"></div>
                        <label for="floatingPassword">Senha</label>
                    </div>


                    <div class="form-floating mb-3">
                        <input type="password" class="form-control" id="floatingConfirmPassword"
                            placeholder="Confirmar Senha" required />
                        <div class="invalid-feedback" id="confirmPasswordFeedback"></div>
                        <label for="floatingConfirmPassword">Confirmar Senha</label>
                    </div>


                    <div class="text-start mb-3 small text-muted">
                        A senha deve conter pelo menos <strong>8 caracteres</strong>, incluindo letras
                        <strong>maiúsculas</strong>,
                        <strong>minúsculas</strong>, <strong>números</strong> e <strong>símbolos</strong>.
                    </div>

                    <div class="form-floating mb-3">
                        <select class="form-select" id="floatingUserType" aria-label="Tipo de Usuário" required>
                            <option selected disabled>Selecione o Tipo de Usuário</option>
                            <option value="producer">Produtor Rural</option>
                            <option value="company">Empresa Compradora</option>
                        </select>
                        <div class="invalid-feedback" id="userTypeFeedback"></div>
                        <label for="floatingUserType">Tipo de Usuário</label>
                    </div>

                    <button class="w-100 btn btn-lg btn-primary" type="submit">
                        Criar Conta
                    </button>

                    <p class="mt-4 text-muted">
                        Já tem uma conta?
                        <a href="login.html" class="text-et-primary text-decoration-none">Faça Login</a>
                    </p>
                </form>
            </div>
        </section>
    </main>

    <footer class="text-center py-3 mt-5 text-muted">
        <small>&copy; 2025 EcoTrade. Todos os direitos reservados.</small>
    </footer>


    <script src="assets/js/main.js"></script>
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
