<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTrade - Registrar Créditos</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <header class="d-flex justify-content-between align-items-center py-3 container">
        <img src="assets/images/Logo Ecotrade.png" alt="EcoTrade Logo" style="max-width: 100px;">
        <button class="btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar"
            aria-controls="offcanvasNavbar">
            <i class="fas fa-bars fa-lg"></i>
        </button>
    </header>

    <main class="container pb-5 mb-5">
        <h1 class="dashboard-header mb-4">Registrar Créditos</h1>

        <section class="info-card">
            <h5 class="fw-normal mb-3">ID do Carbono</h5>

            <div class="text-center">
                <div class="qr-code-placeholder">

                </div>
                <p class="fw-bold">016658A42C</p>
                <p class="text-muted small">Escaneie para verificar a autenticidade</p>
            </div>

            <form id="formCredit">
                <div class="form-floating mb-3">
                    <input type="number" class="form-control" id="floatingQuantity" placeholder="Quantidade (kg)"
                        required>
                    <label for="floatingQuantity">Quantidade (kg)</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="floatingOrigin"
                        placeholder="Origem (Localização/Fazenda)" required>
                    <label for="floatingOrigin">Origem (Localização/Fazenda)</label>
                </div>
                <div class="form-floating mb-4">
                    <input type="date" class="form-control" id="floatingDate" placeholder="Data de Geração" required>
                    <label for="floatingDate">Data de Geração</label>
                </div>



                <button class="w-100 btn btn-lg btn-primary" type="submit">Registrar Crédito</button>
            </form>
        </section>
    </main>

    <footer>
        <nav class="bottom-nav">
            <div class="container">
                <div class="row text-center">
                    <div class="col">
                        <a href="dashboard.html" class="nav-link">
                            <i class="fas fa-home"></i>
                            <span>Dashboard</span>
                        </a>
                    </div>
                    <div class="col">
                        <a href="marketplace.html" class="nav-link">
                            <i class="fas fa-store"></i>
                            <span>Marketplace</span>
                        </a>
                    </div>
                    <div class="col">
                        <a href="record.html" class="nav-link active">
                            <i class="fas fa-plus-circle"></i>
                            <span>Registro</span>
                        </a>
                    </div>
                    <div class="col">
                        <a href="perfil.html" class="nav-link">
                            <i class="fas fa-user"></i>
                            <span>Perfil</span>
                        </a>
                    </div>
                </div>
            </div>
        </nav>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <script src="assets/js/main.js"></script>
</body>

</html>
