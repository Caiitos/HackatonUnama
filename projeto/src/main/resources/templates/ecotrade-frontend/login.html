<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTrade - Login</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <header class="text-center py-3">
        <img src="assets/images/Logo Ecotrade.png" alt="EcoTrade Logo" class="mb-3" style="max-width: 150px;">
    </header>

    <main>
        <section class="container">
            <div class="login-container text-center">
                <h1 class="h3 mb-3 fw-normal">Login</h1>
                <form id="formLogin">
                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="floatingInput" placeholder="nome@exemplo.com"
                            required>
                        <div class="invalid-feedback" id="emailFeedback"></div>
                        <label for="floatingInput">Email</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="password" class="form-control" id="floatingPassword" placeholder="Senha" required>
                        <div class="invalid-feedback" id="passwordFeedback"></div>
                        <label for="floatingPassword">Senha</label>
                    </div>

                    <div class="text-end mb-3">
                        <a href="#" class="text-et-primary text-decoration-none">Esqueceu a senha?</a>
                    </div>

                    <button class="w-100 btn btn-lg btn-primary" type="submit">Entrar</button>



                    <p class="mt-4 text-muted">
                        Não tem uma conta?
                        <a href="cadastro.html" class="text-et-primary text-decoration-none">Cadastre-se</a>
                    </p>
                </form>
            </div>
        </section>
    </main>

    <footer class="text-center py-3 mt-4 text-muted small">
        &copy; 2025 EcoTrade. Todos os direitos reservados.
    </footer>


    <script src="assets/js/main.js"></script>
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
