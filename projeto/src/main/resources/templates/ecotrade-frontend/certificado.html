<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoTrade - Certificado</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Font Awesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Estilos customizados -->
    <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>
    <div class="container pb-5 mb-5">

        <header class="d-flex justify-content-between align-items-center py-3">
            <img src="assets/images/Logo Ecotrade.png" alt="EcoTrade Logo" style="max-width: 100px;" />
            <button class="btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar"
                aria-controls="offcanvasNavbar">
                <i class="fas fa-bars fa-lg"></i>
            </button>
        </header>


        <main>
            <section class="text-center">
                <h1 class="dashboard-header mb-4">Certificado</h1>

                <article class="info-card certificate-card">
                    <div class="carbon-offset-badge">
                        <i class="fas fa-leaf me-2"></i>
                        COMPENSAÇÃO DE CARBONO
                    </div>

                    <h2 class="fw-light mb-4">CERTIFICADO DE</h2>
                    <h1 class="fw-bold text-et-primary mb-4">
                        COMPENSAÇÃO DE CARBONO
                    </h1>

                    <p class="lead mb-1">Para:</p>
                    <h3 class="fw-bold mb-4">Beta Ltda.</h3>

                    <p class="lead mb-1">Quantidade Compensada:</p>
                    <h1 class="display-4 fw-bold mb-5">200 kg</h1>

                    <p class="text-muted fst-italic mb-5">
                        Obrigado por sua contribuição para um futuro mais sustentável.
                    </p>

                    <div class="signature-placeholder mb-4" style="
                height: 50px;
                border-bottom: 1px solid #ccc;
                width: 50%;
                margin: 0 auto;
              "></div>

                    <p class="small text-muted">Assinatura Digital - EcoTrade</p>
                </article>

                <div class="text-center mt-4">
                    <button class="btn btn-outline-primary me-2">
                        <i class="fas fa-download me-2"></i> Baixar PDF
                    </button>
                    <button class="btn btn-outline-secondary">
                        <i class="fas fa-share-alt me-2"></i> Compartilhar
                    </button>
                </div>
            </section>
        </main>
    </div>


    <footer>
        <nav class="bottom-nav">
            <div class="container">
                <div class="row text-center">
                    <div class="col">
                        <a href="dashboard.html" class="nav-link">
                            <i class="fas fa-home"></i>
                            <span>Dashboard</span>
                        </a>
                    </div>
                    <div class="col">
                        <a href="marketplace.html" class="nav-link">
                            <i class="fas fa-store"></i>
                            <span>Marketplace</span>
                        </a>
                    </div>
                    <div class="col">
                        <a href="registro.html" class="nav-link">
                            <i class="fas fa-plus-circle"></i>
                            <span>Registro</span>
                        </a>
                    </div>
                    <div class="col">
                        <a href="perfil.html" class="nav-link active">
                            <i class="fas fa-user"></i>
                            <span>Perfil</span>
                        </a>
                    </div>
                </div>
            </div>
        </nav>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
